<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Keycap — Keyboard Event Inspector</title>
<meta name="description" content="Press any key to see its JavaScript event.key, event.code, keyCode, modifiers and a ready-to-paste listener snippet.">
<meta property="og:title" content="Keycap">
<meta property="og:description" content="Press any key to see its JavaScript event.key, event.code, keyCode, modifiers and a ready-to-paste listener snippet.">
<meta property="og:type" content="website">
<meta property="og:url" content="https://drew-traldi.github.io/keycap-javascript-detection/">
<meta name="twitter:card" content="summary">
<meta name="author" content="Drew Traldi">
<link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns%3D%27http%3A//www.w3.org/2000/svg%27%20viewBox%3D%270%200%20100%20100%27%3E%3Ctext%20y%3D%27.9em%27%20font-size%3D%2790%27%3E%E2%8C%A8%EF%B8%8F%3C/text%3E%3C/svg%3E">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{min-height:100vh;font-family:'Baloo 2',sans-serif;color:#3d2c5c;background:linear-gradient(135deg,#ffe3f1,#e3ecff 50%,#e6fff4);padding:24px 14px}
.w{max-width:1000px;margin:auto;text-align:center}
h1{font-size:clamp(34px,6vw,54px);font-weight:800;letter-spacing:-1px}
.sub{margin-bottom:20px;opacity:.75}
.hero{display:flex;justify-content:center;align-items:center;gap:30px;flex-wrap:wrap;min-height:220px}
.cap{width:180px;height:180px;border-radius:32px;background:linear-gradient(180deg,#fff,#f1e9ff);box-shadow:0 14px 0 #c9b6f0,0 24px 40px rgba(90,60,150,.3),inset 0 -6px 0 rgba(0,0,0,.04);display:grid;place-items:center;font-size:clamp(40px,8vw,64px);font-weight:800;transition:transform .08s,box-shadow .08s;word-break:break-all;padding:10px;line-height:1}
.cap.hit{transform:translateY(10px);box-shadow:0 4px 0 #c9b6f0,0 10px 20px rgba(90,60,150,.3)}
.code{font-size:clamp(90px,18vw,150px);font-weight:800;line-height:1;background:linear-gradient(135deg,#ff6fb5,#8a6bff,#3fd0c9);-webkit-background-clip:text;background-clip:text;color:transparent}
.code small{display:block;font-size:14px;color:#3d2c5c;-webkit-text-fill-color:#3d2c5c;opacity:.6;font-weight:500}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:14px;margin:26px 0}
.f{background:#fff;border-radius:18px;padding:12px 14px;text-align:left;box-shadow:0 6px 0 #eadff8;cursor:pointer;transition:transform .15s}
.f:hover{transform:translateY(-3px)}
.f small{font-size:12px;opacity:.6;display:block}
.f code{font:500 16px 'JetBrains Mono',monospace;color:#8a6bff;word-break:break-all}
.mods{display:flex;gap:10px;justify-content:center;margin-bottom:20px;flex-wrap:wrap}
.mods span{padding:6px 14px;border-radius:12px;background:#fff;box-shadow:0 4px 0 #eadff8;font-weight:700;opacity:.4;transition:.1s}
.mods span.on{opacity:1;background:#ffd6ec;box-shadow:0 4px 0 #ff9fcf}
.kb{display:flex;flex-direction:column;gap:6px;align-items:center;margin-top:10px;overflow-x:auto;padding-bottom:10px}
.kb div{display:flex;gap:6px}
.kb i{font-style:normal;min-width:40px;height:40px;border-radius:10px;background:#fff;box-shadow:0 4px 0 #d8cdf0;display:grid;place-items:center;font-size:13px;font-weight:700;padding:0 8px;transition:.1s}
.kb i.on{background:#8a6bff;color:#fff;box-shadow:0 1px 0 #5a3fd0;transform:translateY(3px)}
.kb i.seen{background:#e8ffef}
.log{font:13px 'JetBrains Mono';text-align:left;background:#fff;border-radius:16px;padding:12px;max-height:160px;overflow:auto;margin-top:20px}
.log div{padding:3px 0;border-bottom:1px dashed #eee}
.idle{font-size:22px;opacity:.6}
</style></head><body><div class="w">
<h1>Keycap ⌨︎</h1><div class="sub">Press any key to inspect its JavaScript event. Click a field to copy it.</div>
<div class="hero"><div class="cap" id="cap">?</div><div class="code" id="code"><span class="idle">press a key</span></div></div>
<div class="mods" id="mods"><span data-m="shiftKey">⇧ Shift</span><span data-m="ctrlKey">⌃ Ctrl</span><span data-m="altKey">⌥ Alt</span><span data-m="metaKey">⌘ Meta</span></div>
<div class="grid" id="grid"></div>
<div class="kb" id="kb"></div>
<div class="log" id="log"></div>
</div>
<script>
const $=id=>document.getElementById(id);
const ROWS=[['Escape','F1','F2','F3','F4','F5','F6','F7','F8','F9','F10','F11','F12'],['Backquote','Digit1','Digit2','Digit3','Digit4','Digit5','Digit6','Digit7','Digit8','Digit9','Digit0','Minus','Equal','Backspace'],['Tab','KeyQ','KeyW','KeyE','KeyR','KeyT','KeyY','KeyU','KeyI','KeyO','KeyP','BracketLeft','BracketRight','Backslash'],['CapsLock','KeyA','KeyS','KeyD','KeyF','KeyG','KeyH','KeyJ','KeyK','KeyL','Semicolon','Quote','Enter'],['ShiftLeft','KeyZ','KeyX','KeyC','KeyV','KeyB','KeyN','KeyM','Comma','Period','Slash','ShiftRight'],['ControlLeft','AltLeft','MetaLeft','Space','MetaRight','AltRight','ArrowLeft','ArrowUp','ArrowDown','ArrowRight']];
const lab=c=>({Backquote:'`',Minus:'-',Equal:'=',BracketLeft:'[',BracketRight:']',Backslash:'\\',Semicolon:';',Quote:"'",Comma:',',Period:'.',Slash:'/',Space:'space',Escape:'esc',Backspace:'⌫',Enter:'⏎',Tab:'⇥',CapsLock:'⇪',ShiftLeft:'⇧',ShiftRight:'⇧',ControlLeft:'⌃',AltLeft:'⌥',AltRight:'⌥',MetaLeft:'⌘',MetaRight:'⌘',ArrowLeft:'←',ArrowUp:'↑',ArrowDown:'↓',ArrowRight:'→'})[c]||c.replace(/^(Key|Digit)/,'');
const W={Backspace:80,Tab:64,CapsLock:76,Enter:84,ShiftLeft:100,ShiftRight:110,Space:240};
$('kb').innerHTML=ROWS.map(r=>`<div>${r.map(c=>`<i data-c="${c}" style="min-width:${W[c]||40}px">${lab(c)}</i>`).join('')}</div>`).join('');
const LOC=['Standard','Left','Right','Numpad'];
addEventListener('keydown',e=>{if(!(e.metaKey&&['r','R'].includes(e.key)))e.preventDefault();
 $('cap').textContent=e.key===' '?'␣':e.key.length>8?e.key.slice(0,8):e.key;$('cap').classList.add('hit');
 $('code').innerHTML=`${e.keyCode}<small>event.keyCode (deprecated)</small>`;
 const F=[['event.key',JSON.stringify(e.key)],['event.code',JSON.stringify(e.code)],['event.which',e.which],['event.location',e.location+' · '+LOC[e.location]],['event.repeat',e.repeat],['Unicode',e.key.length===1?'U+'+e.key.codePointAt(0).toString(16).toUpperCase().padStart(4,'0'):'—'],['Modifiers',['ctrlKey','altKey','shiftKey','metaKey'].filter(k=>e[k]).map(k=>k.replace('Key',''))+''||'none'],['Listener snippet',`if (e.key === ${JSON.stringify(e.key)})`]];
 $('grid').innerHTML=F.map(f=>`<div class="f"><small>${f[0]}</small><code>${String(f[1]).replace(/</g,'&lt;')}</code></div>`).join('');
 $('grid').querySelectorAll('.f').forEach(f=>f.onclick=()=>{navigator.clipboard.writeText(f.querySelector('code').textContent);f.querySelector('small').textContent='copied ✓'});
 $('mods').querySelectorAll('span').forEach(s=>s.classList.toggle('on',e[s.dataset.m]));
 const k=$('kb').querySelector(`[data-c="${e.code}"]`);if(k)k.classList.add('on','seen');
 $('log').insertAdjacentHTML('afterbegin',`<div>keydown · key=${JSON.stringify(e.key).replace(/</g,'&lt;')} code=${e.code} keyCode=${e.keyCode}${e.repeat?' (repeat)':''}</div>`)});
addEventListener('keyup',e=>{$('cap').classList.remove('hit');const k=$('kb').querySelector(`[data-c="${e.code}"]`);if(k)k.classList.remove('on');$('mods').querySelectorAll('span').forEach(s=>s.classList.toggle('on',e[s.dataset.m]))});
</script></body></html>
